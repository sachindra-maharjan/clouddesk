services:
  postgres:
    image: postgres:16-alpine
    network_mode: host
    environment:
      POSTGRES_DB: clouddesk
      POSTGRES_USER: clouddesk
      POSTGRES_PASSWORD: clouddesk
    volumes:
      - ./clouddesk-db:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U clouddesk" ]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./app/backend
    network_mode: host
    environment:
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: clouddesk
      DB_USER: clouddesk
      DB_PASSWORD: clouddesk
      JWT_SECRET: local-dev-secret-change-in-real-envs
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./app/frontend
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  clouddesk-db:
