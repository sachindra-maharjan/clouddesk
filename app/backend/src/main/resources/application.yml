server:
  port: ${SERVER_PORT:8080}
  
spring:
  application:
    name: clouddesk-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:clouddesk}
    username: ${DB_USER:clouddesk}
    password: ${DB_PASSWORD:clouddesk}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: 25MB
      max-request-size: 26MB

management:
  endpoints:
    web:
      exposure:
        include: health,info

clouddesk:
  jwt:
    secret-key: ${JWT_SECRET:dev-only-change-me-dev-only-change-me}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:60}
  files:
    storage-root-dir: ${FILES_STORAGE_DIR:./data/uploads}
    max-upload-size-bytes: 26214400