server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    resolver 10.96.0.10 valid=10s;

    location /api/ {
        set $backend_upstream http://clouddesk-backend-svc.clouddesk.svc.cluster.local:8080;
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
    }

    location /ws {
        set $backend_upstream_ws http://clouddesk-backend-svc.clouddesk.svc.cluster.local:8080;
        proxy_pass $backend_upstream_ws;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
