apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: clouddesk

resources:
- ../../base

# Helm charts are rendered by the helper script before Kustomize applies them.
# Generated manifests live under rendered/ and are intentionally ignored by Git.
resources:
- rendered/backend.yaml
- rendered/frontend.yaml
- rendered/postgres.yaml

patches:  
- path: backend-replicas.yaml
- path: frontend-replicas.yaml
