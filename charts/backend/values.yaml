replicaCount: 2

image:
  repository: clouddesk/backend
  tag: v1
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8080
  targetPort: http

config:
  APP_VERSION: v1
  APP_ENV: development

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 5
  targetCPUUtilizationPercentage: 80

database:
  name: appdb
  user: appuser

secret:
  name: backend-secret
  password: dev-password-change-me
  jwt: dev-jwt-secret-change-me

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 512Mi

probes:
  readiness:
    path: /health
    initialDelaySeconds: 2
    periodSeconds: 5
  liveness:
    path: /health
    initialDelaySeconds: 5
    periodSeconds: 10
